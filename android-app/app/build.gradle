plugins { id 'com.android.application' }

android {
    namespace 'com.anviqo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anviqo.ai.mobile'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
