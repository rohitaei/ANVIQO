name: ANVIQO Pre-Launch Certification
# Certification workflow: production compile + intelligence + tenant + enterprise regression.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANVIQO_SECRET_KEY: prelaunch-test-secret
      ANVIQO_ADMIN_USER: prelaunch-admin
      ANVIQO_ADMIN_PASSWORD: prelaunch-test-password
      ANVIQO_TENANT_DB_URL: sqlite:////tmp/anviqo_prelaunch.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest flask openpyxl
      - name: Compile production Python modules
        run: |
          python - <<'PY'
          import pathlib, py_compile
          excluded = ("backup", "before_", ".anviqo_backup", ".anviqo_backups", "integration_backup")
          failures = []
          for p in pathlib.Path(".").rglob("*.py"):
              s = str(p).replace("\\", "/").lower()
              if any(x in s for x in excluded):
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  failures.append((str(p), str(exc)))
          if failures:
              for path, err in failures:
                  print(path, err)
              raise SystemExit(1)
          print("Production Python compilation PASS") 
          PY
      - name: Capability and safety regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_anvi_capability_engine.py
      - name: Core intelligence regression
        run: >
          pytest -q
          test_phase2_v5_freeze.py
          tests/test_event_correlation.py
          tests/test_root_cause_intelligence_v1.py
          tests/test_root_cause_correlation_v1_3.py
          tests/test_root_cause_conversational_v1.py
          tests/test_failure_prediction_v1.py
          tests/test_failure_prediction_history_v1_1.py
          tests/test_failure_prediction_demo_api.py
          tests/test_failure_prediction_demo_loader.py
      - name: Universal and tenant regression
        run: >
          pytest -q
          test_universal_io_spares.py
          test_universal_command_centre_tenant.py
          tests/test_universal_plant_scope.py
      - name: Phase 4/5/6 regression
        run: >
          pytest -q
          test_phase4_advanced_intelligence_v1.py
          test_phase4_runtime_api_v1.py
          test_phase6_enterprise_foundation_v1.py
          test_phase6_enterprise_command_centre_v2.py
      - name: Release gate
        run: python release_gate_v2.py
