name: ANVIQO Critical Point and Tenant Scope Tests

on:
  pull_request:
    branches:
      - client-acceptance-question-bank-20261103
    paths:
      - "anvi_universal_command_centre.py"
      - "anvi_critical_point_report.py"
      - "tests/test_critical_point_report.py"
      - "tests/test_universal_command_centre_tenant_scope.py"
      - ".github/workflows/critical-point-tenant-tests.yml"
  push:
    branches:
      - client-acceptance-question-bank-20261103

jobs:
  critical-point-tenant-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest Flask
      - name: Run critical-point report and tenant-scope regression tests
        run: python -m pytest -q tests/test_critical_point_report.py tests/test_universal_command_centre_tenant_scope.py
