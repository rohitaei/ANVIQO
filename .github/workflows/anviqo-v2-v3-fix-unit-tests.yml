name: ANVIQO V2-V3 live-fix unit tests

on:
  push:
    branches:
      - qa/v2-v3-live-fixes-20261013
  pull_request:
    branches:
      - v2-v3-unified-industrial-intelligence
    paths:
      - "anviqo_api.py"
      - "anvi_intelligence_orchestrator.py"
      - "field_report_runtime.py"
      - "field_report_persistent_bridge.py"
      - "run_anvi_v2_v3_semantic_regression.py"
      - "tests/test_anvi_intelligence_orchestrator_no_blank.py"
      - "tests/test_field_report_persistent_bridge_completeness.py"
      - "tests/test_field_report_runtime_intent.py"
      - "tests/test_anviqo_api_v3_tag_extraction.py"
      - "tests/test_v2_v3_regression_contracts.py"

jobs:
  targeted-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest requests
      - run: python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: python -m py_compile anviqo_api.py anvi_intelligence_orchestrator.py field_report_runtime.py field_report_persistent_bridge.py run_anvi_v2_v3_semantic_regression.py
      - name: Run targeted regression contracts
        env:
          ANVIQO_SECRET_KEY: "test-only-unit-key"
          ANVIQO_ADMIN_USER: "unit-test-admin"
          ANVIQO_ADMIN_PASSWORD: "unit-test-admin-password"
        run: python -m pytest -q tests/test_anvi_intelligence_orchestrator_no_blank.py tests/test_field_report_persistent_bridge_completeness.py tests/test_field_report_runtime_intent.py tests/test_anviqo_api_v3_tag_extraction.py tests/test_v2_v3_regression_contracts.py
