name: ANVIQO PC Release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd electron && npm install
      - run: cd electron && npm run dist
      - name: Prepare stable Windows name
        shell: bash
        run: cp electron/dist/*.exe ANVIQO-Windows.exe
      - name: Upload Windows app to published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ANVIQO-Windows.exe --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd electron && npm install
      - run: cd electron && npm run dist
      - name: Prepare stable Linux name
        run: cp electron/dist/*.AppImage ANVIQO-Linux.AppImage
      - name: Upload Linux app to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ANVIQO-Linux.AppImage --clobber