name: ANVIQO PC Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd electron && npm install
      - run: cd electron && npm run dist
      - name: Create release if needed
        shell: bash
        env:
          GH_TOKEN: ${R}
        run: gh release view "${R}" >/dev/null 2>&1 || gh release create "${R}" --generate-notes
      - name: Upload Windows app to release
        shell: bash
        env:
          GH_TOKEN: ${R}
        run: gh release upload "${R}" electron/dist/*.exe --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd electron && npm install
      - run: cd electron && npm run dist
      - name: Upload Linux app to release
        env:
          GH_TOKEN: ${R}
        run: gh release upload "${R}" electron/dist/*.AppImage --clobber