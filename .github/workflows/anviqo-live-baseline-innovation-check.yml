name: ANVIQO Live Baseline Innovation Checks

on:
  push:
    branches: [anviqo-innovation-lab-live-2026-11-14]

jobs:
  evidence-decision-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest flask openpyxl
      - name: Compile changed intelligence modules
        run: |
          python -m py_compile anviqo_api.py
          python -m py_compile anvi_decision_brief.py anvi_evidence_assurance.py
      - name: Run evidence assurance and decision brief tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_anvi_evidence_assurance.py tests/test_anvi_inventory_intent.py tests/test_anvi_decision_brief.py
