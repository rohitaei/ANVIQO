name: ANVIQO Live Baseline Innovation Checks

on:
  push:
    branches: [anviqo-innovation-lab-live-2026-11-14]

jobs:
  evidence-decision-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile changed intelligence modules
        run: |
          python -m py_compile anviqo_api.py anvi_universal_command_centre.py
          python -m py_compile anvi_decision_brief.py anvi_evidence_assurance.py anvi_plant_truth_answers.py
      # Full suite includes instrument-versus-spare tag collision regression coverage.
      - name: Run evidence assurance and decision brief tests
        env:
          PYTHONPATH: .
        run: pytest -q tests tests/test_integrated_product_completion.py tests/test_reports_module.py test_universal_command_centre_tenant.py
