name: V14 importer hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover-importer:
    if: ${{ !contains(github.event.head_commit.message, 'V14.16 importer recovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set abandoned-job recovery timeout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anvi_plant_data_import.py')
          s = p.read_text()
          old = "updated_at < NOW() - INTERVAL '20 minutes'"
          new = "updated_at < NOW() - INTERVAL '2 minutes'"
          if old not in s:
              raise SystemExit('Expected 20-minute importer recovery anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          compile(s, str(p), 'exec')
          print('V14.16 importer recovery compile: PASS')
          PY
      - name: Commit recovery hardening
        run: |
          git config user.name 'ANVIQO Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anvi_plant_data_import.py
          git commit -m 'V14.16 importer recovery 2min' || exit 0
          git push
