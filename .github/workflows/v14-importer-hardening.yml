          if old_exc in s: s = s.replace(old_exc, new_exc, 1)
          p.write_text(s)
          compile(p.read_text(), str(p), 'exec')
          print('V14 importer hardening compile: PASS')
          PY
      - name: Commit hardening
        run: |
          git config user.name 'ANVIQO Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anvi_plant_data_import.py .github/workflows/v14-importer-hardening.yml
          git commit -m 'V14.9.1 importer hardening: self-healing worker and bounded batches' || exit 0
          git push
