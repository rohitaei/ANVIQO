name: V14 importer hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-importer:
    if: ${{ !contains(github.event.head_commit.message, 'V14.9.1 importer hardening') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden durable importer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anvi_plant_data_import.py')
          s = p.read_text()
          s = s.replace('BATCH_SIZE = 2000', 'BATCH_SIZE = 250')
          s = s.replace('_LOCAL_WORKER_STARTED = False\n_LOCAL_WORKER_LOCK = threading.Lock()', '_LOCAL_WORKER_STARTED = False\n_LOCAL_WORKER_THREAD = None\n_LOCAL_WORKER_LOCK = threading.Lock()')
          old_matrix = '''def _matrix_records(sheet_name, rows):
    matrix = [tuple(r) for r in rows if any(_nonempty(v) for v in r)]
    if not matrix:
        return
    hi = max(range(min(30, len(matrix))), key=lambda i: _header_score(matrix[i]))
    first = matrix[hi]
    headers, seen = [], {}
    for i, v in enumerate(first):
        h = str(v).strip() if _nonempty(v) else "column_" + str(i + 1)
        k = _key(h); seen[k] = seen.get(k, 0) + 1
        headers.append(h if seen[k] == 1 else h + "_" + str(seen[k]))
    for idx, row in enumerate(matrix[hi + 1:], start=hi + 2):
