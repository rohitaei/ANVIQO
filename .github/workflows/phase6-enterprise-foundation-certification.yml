name: ANVIQO Phase 6 Enterprise Foundation Certification

on:
  push:
    branches: [phase6-enterprise-foundation-v1]
  pull_request:
    branches: [main]

jobs:
  phase6-enterprise:
    runs-on: ubuntu-latest
    env:
      ANVIQO_SECRET_KEY: phase6-ci-secret
      ANVIQO_ADMIN_USER: phase6-ci-admin
      ANVIQO_ADMIN_PASSWORD: phase6-ci-password
      ANVIQO_TENANT_DB_URL: sqlite:////tmp/anviqo_phase6_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest flask openpyxl
      - name: Enterprise foundation tests
        run: pytest -q test_phase6_enterprise_foundation_v1.py test_phase2_tenant_foundation.py
      - name: Compile
        run: python -m py_compile phase6_enterprise_runtime.py anvi_tenant_store.py
      - name: Safety boundary scan
        run: |
          ! grep -RniE 'plc_write[^a-zA-Z]*(true|1)|scada_control[^a-zA-Z]*(true|1)|automatic_execution[^a-zA-Z]*(true|1)' phase6_enterprise_runtime.py
