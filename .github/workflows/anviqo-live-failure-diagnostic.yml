name: ANVIQO live failure diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "run_anviqo_live_failure_diagnostic.py"
      - ".github/workflows/anviqo-live-failure-diagnostic.yml"

jobs:
  live-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests
      - name: Capture raw responses for previously failing live questions
        env:
          ANVIQO_BASE_URL: https://anviqo-v2-v3-test.onrender.com
          ANVIQO_USERNAME: Rohitaei
          ANVIQO_PASSWORD: ${{ secrets.ANVIQO_TEST_PASSWORD }}
          ANVIQO_TEST_TIMEOUT: "90"
        run: python run_anviqo_live_failure_diagnostic.py
      - name: Upload raw diagnostic capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anviqo-live-failure-diagnostic
          path: reports/ANVIQO_LIVE_FAILURE_DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 14
