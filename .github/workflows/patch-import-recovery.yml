name: Patch importer stale recovery
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V14.11 importer heartbeat') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch importer heartbeat and progress logging
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anvi_plant_data_import.py')
          s = p.read_text()
          old = '''def _finish_job(job_id, status, result, message):\n    p = _p()\n'''
          new = '''def _touch_job(job_id):\n    p = _p()\n    try:\n        with store._connect() as conn:\n            if store._is_sqlite():\n                conn.cursor().execute("UPDATE " + JOB_TABLE + " SET updated_at=? WHERE job_id=" + p, (_now(), job_id))\n            else:\n                conn.cursor().execute("UPDATE " + JOB_TABLE + " SET updated_at=NOW() WHERE job_id=" + p, (job_id,))\n    except Exception:\n        pass\n\ndef _finish_job(job_id, status, result, message):\n    p = _p()\n'''
          if old not in s:
              raise SystemExit('finish marker not found')
          s = s.replace(old, new, 1)
          old = '''            try:\n                result = import_plant_data(plant_id, actor); _finish_job(job_id, "SUCCEEDED" if result.get("records_available_to_anvi", 0) > 0 else "FAILED", result, result.get("message", "Import finished.")); print(f"ANVIQO_IMPORT_WORKER finished job={job_id} status={result.get('status')} records={result.get('records_available_to_anvi', 0)} errors={result.get('error_count', 0)}", flush=True)\n'''
          new = '''            try:\n                print(f"ANVIQO_IMPORT_WORKER processing job={job_id} plant={plant_id}", flush=True)\n                hb_stop = threading.Event()\n                def _hb():\n                    while not hb_stop.wait(20):\n                        _touch_job(job_id)\n                        print(f"ANVIQO_IMPORT_WORKER heartbeat job={job_id}", flush=True)\n                hb = threading.Thread(target=_hb, name="anviqo-import-heartbeat", daemon=True); hb.start()\n                try:\n                    result = import_plant_data(plant_id, actor)\n                finally:\n                    hb_stop.set(); hb.join(timeout=2); _touch_job(job_id)\n                _finish_job(job_id, "SUCCEEDED" if result.get("records_available_to_anvi", 0) > 0 else "FAILED", result, result.get("message", "Import finished.")); print(f"ANVIQO_IMPORT_WORKER finished job={job_id} status={result.get('status')} records={result.get('records_available_to_anvi', 0)} errors={result.get('error_count', 0)}", flush=True)\n'''
          if old not in s:
              raise SystemExit('worker marker not found')
          s = s.replace(old, new, 1)
          old = '''                    a, e = _insert_batch(plant_id, actor["organization_id"], document_id, digest, batch); total += a; errors.extend({"filename": filename, "error": x} for x in e); batch = []\n'''
          new = '''                    a, e = _insert_batch(plant_id, actor["organization_id"], document_id, digest, batch); total += a; errors.extend({"filename": filename, "error": x} for x in e); print(f"ANVIQO_IMPORT_PROGRESS file={filename} records={total} errors={len(errors)}", flush=True); batch = []\n'''
          if old not in s:
              raise SystemExit('batch marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit importer patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anvi_plant_data_import.py
          git diff --cached --quiet || git commit -m 'V14.11 importer heartbeat and progress logging'
          git push
