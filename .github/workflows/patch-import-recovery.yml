name: Patch importer stale recovery
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V14.10 recover stale import jobs promptly') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale RUNNING recovery window
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anvi_plant_data_import.py')
          s = p.read_text()
          old = "INTERVAL '20 minutes'"
          new = "INTERVAL '2 minutes'"
          if old not in s:
              raise SystemExit('expected recovery interval not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anvi_plant_data_import.py
          git commit -m 'V14.10 importer recover stale jobs after 2 minutes'
          git push