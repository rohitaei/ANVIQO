name: ANVIQO Phase 5 Command Centre Certification

on:
  push:
    branches: [phase5-human-management-intelligence-v1]
  pull_request:
    branches: [main]

jobs:
  phase5-command-centre:
    runs-on: ubuntu-latest
    env:
      ANVIQO_SECRET_KEY: phase5-ci-secret
      ANVIQO_ADMIN_USER: phase5-ci-admin
      ANVIQO_ADMIN_PASSWORD: phase5-ci-password
      ANVIQO_TENANT_DB_URL: sqlite:////tmp/anviqo_phase5_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest flask openpyxl
      - name: Phase 5 module and Command Centre tests
        run: pytest -q test_phase5_human_management_intelligence_v1.py test_phase5_command_centre_v1.py
      - name: Compile Phase 5 runtime
        run: python -m py_compile phase5_human_management_intelligence.py phase5_command_centre_runtime.py
      - name: Safety boundary scan
        run: |
          ! grep -RniE 'plc_write[^a-zA-Z]*(true|1)|scada_control[^a-zA-Z]*(true|1)' phase5_human_management_intelligence.py phase5_command_centre_runtime.py
