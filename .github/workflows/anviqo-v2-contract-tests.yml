name: ANVIQO V2 contract tests

on:
  push:
    branches:
      - v2-global-industrial-intelligence
  pull_request:
    branches:
      - v2-global-industrial-intelligence

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_global_v2_contracts.py tests/test_global_v2_observation_contract.py tests/test_global_v2_edge_registry.py tests/test_global_v2_evidence_ledger.py tests/test_global_v2_realtime_store.py tests/test_global_v2_realtime_replay.py tests/test_global_v2_event_correlation.py tests/test_global_v2_capability_contracts.py tests/test_global_v2_evidence_graph.py tests/test_global_v2_intelligence_boundaries.py tests/test_global_v2_timeseries_contract.py tests/test_global_v2_secure_edge_runtime.py tests/test_global_v2_edge_ingestion_bridge.py tests/test_global_v2_audit_contract.py tests/test_global_v2_final_release_gate.py
