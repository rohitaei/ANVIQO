name: ANVIQO Phase 6 Enterprise V4 Certification

on:
  push:
    branches: [phase6-enterprise-v4-context-switching]
  pull_request:
    branches: [main]

jobs:
  phase6-enterprise-v4:
    runs-on: ubuntu-latest
    env:
      ANVIQO_SECRET_KEY: phase6-v4-ci-secret
      ANVIQO_ADMIN_USER: phase6-v4-ci-admin
      ANVIQO_ADMIN_PASSWORD: phase6-v4-ci-password
      ANVIQO_TENANT_DB_URL: sqlite:////tmp/anviqo_phase6_v4_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest flask openpyxl
      - name: V4 context switching tests
        run: pytest -q test_phase6_enterprise_command_centre_v4.py test_phase6_enterprise_command_centre_v3.py test_phase6_enterprise_command_centre_v2.py test_phase6_enterprise_foundation_v1.py test_phase2_tenant_foundation.py
      - name: Compile
        run: python -m py_compile phase6_enterprise_runtime.py phase6_enterprise_runtime_v4.py phase6_enterprise_command_centre_v2.py phase6_enterprise_command_centre_v3.py phase6_enterprise_command_centre_v4.py
      - name: Safety boundary scan
        run: |
          ! grep -RniE 'plc_write[^a-zA-Z]*(true|1)|scada_control[^a-zA-Z]*(true|1)|automatic_execution[^a-zA-Z]*(true|1)' phase6_enterprise_runtime.py phase6_enterprise_runtime_v4.py phase6_enterprise_command_centre_v2.py phase6_enterprise_command_centre_v3.py phase6_enterprise_command_centre_v4.py
