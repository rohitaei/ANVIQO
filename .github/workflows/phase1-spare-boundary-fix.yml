name: Phase 1 Spare Boundary Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install test dependencies
        shell: bash
        run: |
          python3 -m pip install -r requirements.txt

      - name: Apply minimal Phase 1 boundary fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          head = '${{ github.event.head_commit.message }}'
          if 'Phase 1: secure spare boundary' in head:
              print('Verified fix commit detected; nothing to do.')
              raise SystemExit(0)

          p = Path('anvi_knowledge_layer.py')
          s = p.read_text(encoding='utf-8')
          needle = '''                if isinstance(spare_result, dict):\n                    domain = str(\n                        spare_result.get("domain", "")\n                    ).lower()\n'''
          replacement = '''                if isinstance(spare_result, dict):\n                    # Phase 1: direct inventory mutations are authenticated\n                    # at /api/ask and must return their governed result\n                    # immediately. Never let a mutation fall through into\n                    # read-only PCI/LLM routing.\n                    if spare_result.get("inventory_mutation") is True:\n                        return spare_result\n\n                    domain = str(\n                        spare_result.get("domain", "")\n                    ).lower()\n'''
          if needle not in s:
              raise SystemExit('Knowledge-layer mutation boundary anchor not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('anvi_field_report.py')
          s = p.read_text(encoding='utf-8')
          start = s.find('    # ANVIQO_FIELD_REPORT_AUTO_SPARE_DEDUCTION_V2')
          end = s.find('    record["inventory_update"] = inventory_update', start)
          if start < 0 or end < 0:
              raise SystemExit('Field-report deduction boundary anchors not found')

          replacement = '''    # Phase 1 safety boundary:\n    # A field report is PENDING_VERIFICATION and therefore cannot mutate\n    # authoritative critical-spare inventory. Spare usage is captured in\n    # Plant Memory/report evidence only until a governed inventory command\n    # is explicitly executed.\n    spare_text = str(record.get("spare_used") or "").strip()\n    if spare_text:\n        inventory_update = {\n            "status": "PENDING_VERIFICATION",\n            "spare_claim": spare_text,\n            "inventory_changed": False,\n            "message": (\n                "Reported spare usage captured for verification; "\n                "authoritative inventory was not changed."\n            ),\n        }\n    else:\n        inventory_update = {\n            "status": "NOT_APPLICABLE",\n            "inventory_changed": False,\n        }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Focused Phase 1 boundary test
        shell: bash
        run: |
          python3 -m py_compile anvi_knowledge_layer.py anvi_field_report.py pci_spares.py
          python3 - <<'PY'
          from pathlib import Path
          knowledge = Path('anvi_knowledge_layer.py').read_text(encoding='utf-8')
          field_report = Path('anvi_field_report.py').read_text(encoding='utf-8')
          assert 'spare_result.get("inventory_mutation") is True' in knowledge
          assert 'ANVIQO_FIELD_REPORT_AUTO_SPARE_DEDUCTION_V2' not in field_report
          assert 'PENDING_VERIFICATION' in field_report
          assert 'inventory_changed' in field_report
          import pci_spares
          result = pci_spares.answer_spare_management_v16('use 999999 PT-303')
          assert result.get('inventory_mutation') is True
          assert result.get('executed') is False
          assert result.get('blocked') is True
          assert result.get('plc_write') is False
          assert result.get('scada_control') is False
          query = pci_spares.answer_spare_management_v16('Do we have a spare for PT-303?')
          assert 'PT-303' in str(query)
          print('PHASE1_SPARE_BOUNDARY_TEST: PASS')
          PY

      - name: Commit verified Phase 1 fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anvi_knowledge_layer.py anvi_field_report.py
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Phase 1: secure spare boundary"
          git push origin main
