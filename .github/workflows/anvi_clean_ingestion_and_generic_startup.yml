name: ANVI clean ingestion reset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'ANVI clean universal ingestion + generic startup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace old ingestion queue with clean run pipeline
        shell: bash
        run: |
          cat > anvi_plant_ingestion_v2.py <<'PY'
          """Clean universal plant ingestion runner.

          This replaces the old repair/recovery queue logic. Existing legacy
          ingestion jobs are deliberately left untouched and are not read,
          repaired, requeued, or used by this runner.

          CHANGE DATA, NOT CODE. V5 remains frozen/read-only.
          """
          from __future__ import annotations

          import json
          import os
          import threading
          import uuid
          from datetime import datetime, timezone

          import anvi_tenant_store as store
          from universal_onboarding import SAFETY

          INGESTION_VERSION = "ANVIQO-UNIVERSAL-INGESTION-V3"
          TABLE = "anviqo_plant_ingestion_runs"

          def _now():
              return datetime.now(timezone.utc)

          def _iso(dt):
              return dt.isoformat()

          def _p():
              return store._placeholder()

          def _actor():
              from flask import session
              return {
                  "user_id": session.get("user_id", ""),
                  "organization_id": session.get("organization_id", ""),
                  "plant_id": session.get("plant_id", ""),
                  "role": session.get("role", ""),
                  "username": session.get("username", ""),
              }

          def _plant_ok(plant_id, actor):
              if not actor.get("user_id") or not actor.get("organization_id") or actor.get("role") not in {"OWNER", "ADMIN"}:
                  return False
              p = _p()
              with store._connect() as conn:
                  cur = conn.cursor()
                  cur.execute(
                      f"SELECT 1 FROM anviqo_plants WHERE plant_id={p} AND organization_id={p} AND status='ACTIVE' LIMIT 1",
                      (plant_id, actor["organization_id"]),
                  )
                  return cur.fetchone() is not None

          def init_schema():
              if not store.enabled():
                  return
              with store._connect() as conn:
                  cur = conn.cursor()
                  if store._is_sqlite():
                      cur.execute(
                          f"CREATE TABLE IF NOT EXISTS {TABLE} (job_id TEXT PRIMARY KEY, organization_id TEXT NOT NULL, plant_id TEXT NOT NULL, actor_json TEXT NOT NULL DEFAULT '{}', status TEXT NOT NULL DEFAULT 'QUEUED', message TEXT NOT NULL DEFAULT '', result_json TEXT NOT NULL DEFAULT '{}', created_at TEXT NOT NULL DEFAULT '', started_at TEXT, finished_at TEXT, updated_at TEXT NOT NULL DEFAULT '')"
                      )
                  else:
                      cur.execute(
                          f"CREATE TABLE IF NOT EXISTS {TABLE} (job_id TEXT PRIMARY KEY, organization_id TEXT NOT NULL REFERENCES anviqo_organizations(organization_id), plant_id TEXT NOT NULL REFERENCES anviqo_plants(plant_id), actor_json JSONB NOT NULL DEFAULT '{{}}'::jsonb, status TEXT NOT NULL DEFAULT 'QUEUED', message TEXT NOT NULL DEFAULT '', result_json JSONB NOT NULL DEFAULT '{{}}'::jsonb, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(), started_at TIMESTAMPTZ, finished_at TIMESTAMPTZ, updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW())"
                      )
                      cur.execute(f"CREATE INDEX IF NOT EXISTS idx_{TABLE}_status ON {TABLE}(status, created_at)")
                      cur.execute(f"CREATE INDEX IF NOT EXISTS idx_{TABLE}_plant ON {TABLE}(organization_id, plant_id, created_at DESC)")

          def _new_job_id():
              return "ingv3_" + uuid.uuid4().hex

          def enqueue_job(plant_id, actor):
              init_schema()
              p = _p()
              now = _iso(_now())
              with store._connect() as conn:
                  cur = conn.cursor()
                  cur.execute(
                      f"SELECT job_id,status FROM {TABLE} WHERE plant_id={p} AND organization_id={p} AND status IN ('QUEUED','RUNNING') ORDER BY created_at DESC LIMIT 1",
                      (plant_id, actor["organization_id"]),
                  )
                  active = cur.fetchone()
                  if active:
                      return {"job_id": active[0], "job_status": active[1], "existing": True}
                  jid = _new_job_id()
                  cur.execute(
                      f"INSERT INTO {TABLE}(job_id,organization_id,plant_id,actor_json,status,message,created_at,updated_at) VALUES({','.join([p]*8)})",
                      (jid, actor["organization_id"], plant_id, json.dumps(actor, separators=(",", ":")), "QUEUED", "Queued for clean universal ingestion.", now, now),
                  )
                  try:
                      cur.execute(
                          f"UPDATE anviqo_plant_onboarding SET status='INDEXING',updated_at={p} WHERE plant_id={p} AND organization_id={p}",
                          (now, plant_id, actor["organization_id"]),
                      )
                  except Exception:
                      pass
              return {"job_id": jid, "job_status": "QUEUED", "created_at": now, "updated_at": now, "existing": False}

          def ingest_plant(plant_id, actor=None):
              if not actor or not _plant_ok(plant_id, actor):
                  raise PermissionError("OWNER/ADMIN access to this plant is required")
              import anvi_plant_ingestion_runtime as runtime
              result = runtime.ingest_plant(plant_id, actor)
              result["ingestion_version"] = INGESTION_VERSION
              result["safety"] = dict(SAFETY)
              return result

          def _finish_job(jid, plant, org, actor):
              try:
                  result = ingest_plant(plant, actor)
                  status = "COMPLETED" if result.get("status") == "OK" and not result.get("errors") else "COMPLETED_WITH_ERRORS"
                  message = f"Processed {result.get('documents_processed', 0)} documents and indexed {result.get('records_indexed', 0)} records."
              except Exception as exc:
                  result = {"status": "ERROR", "plant_id": plant, "message": str(exc), "safety": dict(SAFETY)}
                  status = "FAILED"
                  message = str(exc)
              try:
                  with store._connect() as conn:
                      cur = conn.cursor()
                      p = _p()
                      cur.execute(
                          f"UPDATE {TABLE} SET status={p},message={p},result_json={p},finished_at={p},updated_at={p} WHERE job_id={p}",
                          (status, message, json.dumps(result, default=str), _iso(_now()), _iso(_now()), jid),
                      )
                      if status in {"COMPLETED", "COMPLETED_WITH_ERRORS"}:
                          cur.execute(
                              f"UPDATE anviqo_plant_onboarding SET status={p},updated_at={p} WHERE plant_id={p} AND organization_id={p}",
                              ("DATA_UPLOADED", _iso(_now()), plant, org),
                          )
                      elif status == "FAILED":
                          cur.execute(
                              f"UPDATE anviqo_plant_onboarding SET status='ERROR',updated_at={p} WHERE plant_id={p} AND organization_id={p}",
                              (_iso(_now()), plant, org),
                          )
              except Exception as exc:
                  print(f"ANVI clean ingestion job {jid} finalization error: {exc}", flush=True)

          def _claim_job():
              init_schema()
              p = _p()
              with store._connect() as conn:
                  cur = conn.cursor()
                  cur.execute(f"SELECT job_id,plant_id,organization_id,actor_json FROM {TABLE} WHERE status='QUEUED' ORDER BY created_at LIMIT 1")
                  row = cur.fetchone()
                  if not row:
                      return None
                  jid, plant, org, raw = row
                  actor = raw if isinstance(raw, dict) else json.loads(raw or "{}")
                  now = _iso(_now())
                  cur.execute(
                      f"UPDATE {TABLE} SET status={p},message={p},started_at={p},updated_at={p} WHERE job_id={p} AND status='QUEUED'",
                      ("RUNNING", "Worker claimed clean ingestion job.", now, now, jid),
                  )
                  if cur.rowcount != 1:
                      return None
              return jid, plant, org, actor

          def _dispatch_once():
              claimed = _claim_job()
              if not claimed:
                  return {"processed": 0, "queued_only": True, "safety": dict(SAFETY)}
              jid, plant, org, actor = claimed
              threading.Thread(target=_finish_job, args=(jid, plant, org, actor), daemon=True, name=f"anvi-clean-ingest-{jid}").start()
              return {"processed": 1, "job_id": jid, "status": "RUNNING", "safety": dict(SAFETY)}

          def register(app):
              init_schema()

              @app.post("/api/admin/onboarding/plant/<plant_id>/ingest")
              def ingestion_start(plant_id):
                  from flask import jsonify
                  actor = _actor()
                  if not _plant_ok(plant_id, actor):
                      return jsonify({"error": "OWNER/ADMIN access to this plant is required"}), 403
                  return jsonify(enqueue_job(plant_id, actor)), 202

              @app.get("/api/admin/onboarding/plant/<plant_id>/ingest/status")
              def ingestion_status(plant_id):
                  from flask import jsonify
                  actor = _actor()
                  p = _p()
                  if not _plant_ok(plant_id, actor):
                      return jsonify({"error": "OWNER/ADMIN access to this plant is required"}), 403
                  with store._connect() as conn:
                      cur = conn.cursor()
                      cur.execute(
                          f"SELECT job_id,status,message,result_json,created_at,started_at,finished_at,updated_at FROM {TABLE} WHERE plant_id={p} AND organization_id={p} ORDER BY created_at DESC LIMIT 1",
                          (plant_id, actor["organization_id"]),
                      )
                      row = cur.fetchone()
                  if not row:
                      return jsonify({"status": "NOT_STARTED", "job_status": "NOT_STARTED"})
                  jid, status, message, result, created, started, finished, updated = row
                  if isinstance(result, str):
                      try:
                          result = json.loads(result or "{}")
                      except Exception:
                          result = {}
                  return jsonify({
                      "job_id": jid,
                      "status": status,
                      "job_status": status,
                      "message": message,
                      "result": result or {},
                      "created_at": str(created),
                      "started_at": str(started) if started else None,
                      "finished_at": str(finished) if finished else None,
                      "updated_at": str(updated) if updated else None,
                  })

              @app.post("/api/internal/ingestion/dispatch")
              def ingestion_internal_dispatch():
                  from flask import jsonify
                  return jsonify(_dispatch_once())
          PY

      - name: Make ANVI startup plant-neutral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('anviqo_dashboard.html')
          s = p.read_text()
          s = s.replace('Ask me about MBF-2 plant health, alarms, instruments, MBF-2 I/O, equipment, maintenance, events, shift intelligence or plant context.', 'Ask me about plant health, alarms, instruments, I/O, equipment, maintenance, events, shift intelligence or plant context.')
          s = s.replace('MBF-2 I/O<br>', 'I/O<br>')
          p.write_text(s)
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/anvi_clean_ingestion_and_generic_startup.yml
          git add anvi_plant_ingestion_v2.py anviqo_dashboard.html
          git commit -m "ANVI clean universal ingestion + generic startup"
          git push
