name: ANVIQO Phase 6 Enterprise V5 Certification

on:
  push:
    branches: [phase6-enterprise-v5-context-propagation]
  pull_request:
    branches: [main]

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest flask openpyxl
      - name: V5 context tests
        run: pytest -q test_phase6_enterprise_context_v5.py test_phase6_enterprise_command_centre_v4.py test_phase6_enterprise_command_centre_v3.py test_phase6_enterprise_command_centre_v2.py test_phase6_enterprise_foundation_v1.py test_phase2_tenant_foundation.py
      - name: Compile changed runtime
        run: python -m py_compile phase6_enterprise_runtime.py phase6_enterprise_runtime_v4.py phase6_enterprise_command_centre_v4.py phase6_enterprise_context_v5.py
      - name: Safety gate
        run: |
          ! grep -RniE 'plc_write[[:space:]]*=[[:space:]]*True|scada_control[[:space:]]*=[[:space:]]*True|automatic_execution[[:space:]]*=[[:space:]]*True' phase6_enterprise_context_v5.py phase6_enterprise_command_centre_v4.py phase6_enterprise_runtime_v4.py
