name: BF-2 PCI resolver predeploy check\non:\n  push:\n    branches: [predeploy-bf2-pci-check]\n  pull_request:\n    branches: [main]\njobs:\n  resolver:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Install runtime dependencies\n        run: python -m pip install -r requirements.txt\n      - name: Compile target modules\n        run: python -m py_compile anvi_chat_stability_v2.py universal_onboarding.py pci_universal_resolver.py tests/test_bf2_pci_resolver.py\n      - name: Run BF-2 PCI resolver check\n        id: resolver\n        continue-on-error: true\n        run: |\n          set -o pipefail\n          python tests/test_bf2_pci_resolver.py 2>&1 | tee resolver-output.txt\n      - name: Publish failure details\n        if: steps.resolver.outcome == 'failure'\n        uses: actions/github-script@v7\n        with:\n          script: |\n            const fs = require('fs');\n            const output = fs.readFileSync('resolver-output.txt', 'utf8');\n            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'BF-2 resolver failure:\n\n' + output.slice(-12000)});\n            core.setFailed('BF-2 resolver check failed; see PR comment for exact output.');\n