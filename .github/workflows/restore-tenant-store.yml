name: Restore tenant store
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-tenant-store.yml
permissions:
  contents: write
jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, 'Restore tenant store from 88e8') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact known-good tenant store and add Render TLS
        run: |
          git checkout 88e8b69362f3161f0524ac05429691594af757d4 -- anvi_tenant_store.py
          python - <<'PY'
          from pathlib import Path
          p = Path('anvi_tenant_store.py')
          s = p.read_text()
          old = 'TENANT_DB_URL = os.getenv("ANVIQO_TENANT_DB_URL", "").strip()\n'
          new = old + '''\n# Render PostgreSQL requires TLS. Keep the tenant store on a secure production connection.\nif not TENANT_DB_URL.startswith("sqlite:") and (TENANT_DB_URL or DATABASE_URL):\n    if TENANT_DB_URL and "sslmode=" not in TENANT_DB_URL.lower():\n        TENANT_DB_URL += ("&" if "?" in TENANT_DB_URL else "?") + "sslmode=require"\n    elif not TENANT_DB_URL and "sslmode=" not in DATABASE_URL.lower():\n        DATABASE_URL += ("&" if "?" in DATABASE_URL else "?") + "sslmode=require"\n'''
          if old not in s:
              raise SystemExit('tenant store anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python -m py_compile anvi_tenant_store.py
          git config user.name 'ANVIQO Restore Bot'
          git config user.email 'actions@github.com'
          git add anvi_tenant_store.py
          git commit -m 'Restore tenant store from 88e8' || exit 0
          git push origin HEAD:main
