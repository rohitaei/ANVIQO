name: ANVIQO V2 Regression Tests

on:
  push:
    branches:
      - main
      - v2-real-time-industrial-intelligence
  pull_request:
    branches:
      - main
      - v2-real-time-industrial-intelligence

jobs:
  v2-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile V2 modules
        run: python -m compileall -q v2 tests/test_v2_*.py

      - name: Run V2 regression tests
        run: |
          python -m pytest -q             tests/test_v2_data_fabric.py             tests/test_v2_data_trust.py             tests/test_v2_plant_brain.py             tests/test_v2_watch.py             tests/test_v2_equipment_dna.py             tests/test_v2_source_adapters.py \
              tests/test_v2_event_context.py
