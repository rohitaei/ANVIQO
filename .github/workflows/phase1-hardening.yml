name: Phase 1 hardening patch
on:
  push:
    paths:
      - PHASE1_HARDENING_TRIGGER.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal Phase 1 hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('anviqo_api.py')
          s=p.read_text()
          s=s.replace('app.config["SESSION_COOKIE_SECURE"] = False','app.config["SESSION_COOKIE_SECURE"] = True')
          old='''    try:\n        q=(request.get_json(silent=True) or {}).get("question","").strip()\n        return knowledge_ask(q)'''
          new='''    try:\n        q=(request.get_json(silent=True) or {}).get("question","").strip()\n\n        # Phase 1: inventory mutations require an authenticated ADMIN session.\n        # Read-only questions remain available to any authenticated session.\n        from pci_spares import _extract_tag\n        mutation_words = (" add ", " added ", " receive ", " received ", " use ", " used ", " remove ", " removed ", " consume ", " consumed ")\n        q_probe = " " + q.lower() + " "\n        if any(word in q_probe for word in mutation_words) and _extract_tag(q):\n            if session.get("role") != "ADMIN":\n                return jsonify({\n                    "status": "FORBIDDEN",\n                    "message": "Inventory mutation requires ADMIN authorization.",\n                    "inventory_mutation": True,\n                    "executed": False,\n                    "blocked": True,\n                    "read_only": True,\n                    "plc_write": False,\n                    "scada_control": False,\n                }), 403\n\n        return knowledge_ask(q)'''
          if old not in s: raise SystemExit('ask block not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('anviqo_v5_test.py')
          s=p.read_text()
          old='''if failed == 0:\n    print("\\nANVIQO V5 MASTER REGRESSION: PASS")\nelse:\n    print("\\nANVIQO V5 MASTER REGRESSION: ATTENTION REQUIRED")\n\nprint("========================================")'''
          new='''if failed == 0:\n    print("\\nANVIQO V5 MASTER REGRESSION: PASS")\nelse:\n    print("\\nANVIQO V5 MASTER REGRESSION: ATTENTION REQUIRED")\n\nprint("========================================")\n\n# CI-safe contract: never report a failing regression as a successful process.\nraise SystemExit(1 if failed else 0)'''
          if old not in s: raise SystemExit('regression ending not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 -m py_compile anviqo_api.py anviqo_v5_test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anviqo_api.py anviqo_v5_test.py
          git commit -m 'Phase 1: harden session and regression gate'
          git push
