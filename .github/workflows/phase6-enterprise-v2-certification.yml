name: ANVIQO Phase 6 Enterprise Command Centre V2 Certification

on:
  push:
    branches: [phase6-enterprise-v2]
  pull_request:
    branches: [main]

jobs:
  enterprise-v2:
    runs-on: ubuntu-latest
    env:
      ANVIQO_SECRET_KEY: phase6-v2-secret
      ANVIQO_ADMIN_USER: phase6-v2-admin
      ANVIQO_ADMIN_PASSWORD: phase6-v2-password
      ANVIQO_TENANT_DB_URL: sqlite:////tmp/anviqo_phase6_v2.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest flask openpyxl
      - name: Enterprise V2 tests and regressions
        run: pytest -q test_phase6_enterprise_command_centre_v2.py test_phase6_enterprise_foundation_v1.py test_phase2_tenant_foundation.py test_phase5_command_centre_v1.py test_phase5_live_evidence_adapter.py test_phase5_human_management_intelligence.py test_failure_prediction_dashboard.py
      - name: Compile
        run: python -m py_compile phase6_enterprise_command_centre_v2.py phase6_enterprise_runtime.py phase5_command_centre_runtime.py
      - name: Safety boundary scan
        run: |
          ! grep -RniE 'plc_write[^a-zA-Z]*(true|1)|scada_control[^a-zA-Z]*(true|1)|automatic_execution[^a-zA-Z]*(true|1)' phase6_enterprise_command_centre_v2.py
