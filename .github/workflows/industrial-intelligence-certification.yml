name: ANVIQO Industrial Intelligence Certification
on:
  push:
    branches: ["anviqo-complete-industrial-intelligence"]
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile industrial_intelligence_platform.py anviqo_api.py
      - run: pytest -q test_industrial_intelligence_platform.py
