name: ANVIQO Client Acceptance Question Bank

on:
  pull_request:
    branches: [main, audit/demo-readiness-pr80-20261103, client-acceptance-question-bank-20261103]
    paths:
      - "tests/data/anviqo_client_acceptance_questions.json"
      - "tests/test_client_acceptance_question_bank.py"
      - "test_plant_scoped_auth.py"
      - "anvi_chat_stability_v2.py"
      - "anvi_critical_point_report.py"
      - "tests/test_critical_point_report.py"
      - "anvi_universal_command_centre.py"
      - "test_universal_command_centre_tenant.py"
      - ".github/workflows/client-acceptance-question-bank.yml"
  push:
    branches: [client-acceptance-question-bank-20261103]
    paths:
      - "tests/data/anviqo_client_acceptance_questions.json"
      - "tests/test_client_acceptance_question_bank.py"
      - "test_plant_scoped_auth.py"
      - "anvi_chat_stability_v2.py"
      - "anvi_critical_point_report.py"
      - "tests/test_critical_point_report.py"
      - ".github/workflows/client-acceptance-question-bank.yml"

permissions:
  contents: read

jobs:
  validate-question-bank:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ANVIQO_SECRET_KEY: ci-test-secret
      ANVIQO_ADMIN_USER: ci-admin
      ANVIQO_ADMIN_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest && python -m pip install -r requirements.txt
      - name: Validate complete client acceptance corpus
        run: >-
          pytest -q tests/test_critical_point_report.py
          tests/test_client_acceptance_question_bank.py
          test_plant_scoped_auth.py
          test_universal_command_centre_tenant.py
