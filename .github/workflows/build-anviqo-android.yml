name: Build ANVI Chat Android App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-anviqo-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$SDK_ROOT/platform-tools:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK and Play Store AAB
        working-directory: android-app
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANVIQO-Android-APK
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Verify APK and AAB
        working-directory: android-app
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          stat -c "APK_SIZE_BYTES=%s" "$APK"
          test -s "app/build/outputs/bundle/release/app-release.aab"
          stat -c "AAB_SIZE_BYTES=%s" "app/build/outputs/bundle/release/app-release.aab"

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk ANVI-Chat.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab ANVI-Chat.aab
          gh release delete anviqo-android-latest --yes --cleanup-tag || true
          gh release create anviqo-android-latest ANVI-Chat.apk ANVI-Chat.aab --target "$GITHUB_SHA" --title "ANVI Chat v1.0.0" --notes "Native ANVI Chat app connected to the existing ANVIQO intelligence layer. Read-only, evidence-first, human governed. No PLC write or SCADA control."
