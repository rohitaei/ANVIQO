name: Failure Prediction Dashboard

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest flask openpyxl
      - run: python -m py_compile failure_prediction_dashboard_runtime.py failure_prediction_demo_api.py failure_prediction_api.py
      - name: Run dashboard tests
        env:
          ANVIQO_SECRET_KEY: dashboard-test-secret
          ANVIQO_ADMIN_USER: dashboard-test-admin
          ANVIQO_ADMIN_PASSWORD: dashboard-test-password
        run: pytest -q test_failure_prediction_demo_loader.py test_failure_prediction_demo_api.py test_failure_prediction_dashboard_v1.py

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build ANVIQO Android app
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANVIQO-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ANVIQO.apk
          gh release delete anviqo-android-latest --yes --cleanup-tag || true
          gh release create anviqo-android-latest ANVIQO.apk --target "${GITHUB_SHA}" --title "ANVIQO Android App v1.1.0" --notes "ANVIQO native mobile command-centre with live ANVIQO intelligence connection. Safety boundary: read-only, human governed."
