name: V14.12 importer lock recovery
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V14.12 importer lock recovery') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add importer lock and statement timeouts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sitecustomize.py')
          s = p.read_text()
          old = '''                if getattr(_importing, "active", False) and not _anvi_store._is_sqlite():\n                    conn.execute("SET LOCAL statement_timeout = '15s'")\n'''
          new = '''                if getattr(_importing, "active", False) and not _anvi_store._is_sqlite():\n                    conn.execute("SET LOCAL lock_timeout = '3000'")\n                    conn.execute("SET LOCAL statement_timeout = '5000'")\n'''
          if old not in s:
              raise SystemExit('timeout hook marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitecustomize.py
          git diff --cached --quiet || git commit -m 'V14.12 importer lock recovery'
          git push
