name: Phase 2 tenant foundation tests

on:
  push:
    branches:
      - phase2-tenant-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tenant-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest Flask

      - name: Compile Phase 2 modules
        run: python -m py_compile anvi_tenant_store.py anviqo_api_phase2.py test_phase2_tenant_foundation.py test_phase2_api_boundary.py test_phase2_v5_freeze.py

      - name: Run Phase 2 tenant tests
        run: pytest -q test_phase2_tenant_foundation.py test_phase2_api_boundary.py

      - name: Verify V5 intelligence remains frozen
        run: pytest -q test_phase2_v5_freeze.py
