name: Phase 2 tenant foundation tests

on:
  push:
    branches:
      - main
      - phase2-tenant-foundation
      - phase2-field-report-spare-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tenant-foundation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ANVIQO_SECRET_KEY: ci-test-secret
      ANVIQO_ADMIN_USER: ci-admin
      ANVIQO_ADMIN_PASSWORD: ci-password
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest Flask openpyxl

      - name: Inspect selected plant critical-spares register
        run: |
          python - <<'PY'
          import json
          from openpyxl import load_workbook
          path = "database/spares/critical_spares.xlsx"
          wb = load_workbook(path, data_only=True, read_only=True)
          print("SPARES_WORKBOOK_SHEETS", json.dumps([(ws.title, ws.max_row, ws.max_column) for ws in wb.worksheets]))
          import re
          def key(v):
              return re.sub(r"[^a-z0-9]+", "", str(v or "").lower())
          stock_aliases = {"qtyavbl", "qtyavailable", "quantityavailable", "available", "stockavailable"}
          for ws in wb.worksheets:
              rows = [[v for v in row] for row in ws.iter_rows(values_only=True)]
              header_idx = None
              headers = None
              for i, row in enumerate(rows[:8]):
                  keys = {key(v) for v in row}
                  if keys & stock_aliases:
                      header_idx, headers = i, row
                      break
              if header_idx is None:
                  continue
              names = [str(v).strip() if v is not None and str(v).strip() else "column_" + str(j+1) for j,v in enumerate(headers)]
              for row_num, row in enumerate(rows[header_idx+1:], header_idx+2):
                  if not any(v is not None and str(v).strip() for v in row):
                      continue
                  item = {names[j]: (row[j] if j < len(row) else None) for j in range(len(names))}
                  if not any(v is not None and str(v).strip() for v in item.values()):
                      continue
                  print("SPARE_ROW_JSON:", json.dumps({"sheet": ws.title, "row": row_num, "data": item}, default=str, ensure_ascii=False))
          PY

      - name: Compile Phase 2, field-report and prediction modules
        run: python -m py_compile anvi_tenant_spares.py anvi_tenant_context_autofix.py anvi_plant_data_import.py universal_onboarding.py tests/test_tenant_spares.py anvi_tenant_store.py anviqo_api_phase2.py field_report_runtime.py failure_prediction.py failure_prediction_api.py failure_prediction_history.py failure_prediction_demo_loader.py failure_prediction_demo_api.py anvi_universal_command_centre.py test_universal_command_centre_tenant.py test_phase2_tenant_foundation.py test_phase2_api_boundary.py test_phase2_v5_freeze.py test_field_report_spare_sync.py test_field_report_query_routing.py test_failure_prediction_v1.py test_failure_prediction_history_v1_1.py test_failure_prediction_demo_loader.py test_failure_prediction_demo_api.py test_universal_io_spares.py

      - name: Run Phase 2 tenant tests
        run: pytest -q tests/test_tenant_spares.py test_phase2_tenant_foundation.py test_phase2_api_boundary.py test_universal_command_centre_tenant.py

      - name: Run universal plant-scope regression tests
        run: pytest -q tests/test_universal_plant_scope.py

      - name: Run event-correlation regression tests
        run: pytest -q tests/test_event_correlation.py

      - name: Run field report and spare regression tests
        run: pytest -q test_field_report_spare_sync.py test_field_report_query_routing.py test_universal_io_spares.py

      - name: Run Failure Prediction regression tests
        run: pytest -q test_failure_prediction_v1.py test_failure_prediction_history_v1_1.py test_failure_prediction_demo_loader.py test_failure_prediction_demo_api.py

      - name: Verify V5 intelligence remains frozen
        run: pytest -q test_phase2_v5_freeze.py
