name: ANVIQO Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: mkdir -p www
      - run: cp anviqo_dashboard.html www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ANVIQO-${R}-android-debug.apk
      - name: Create release if needed
        env:
          GH_TOKEN: ${R}
        run: gh release view "${R}" >/dev/null 2>&1 || gh release create "${R}" --generate-notes
      - name: Upload APK to release
        env:
          GH_TOKEN: ${R}
        run: gh release upload "${R}" ANVIQO-${R}-android-debug.apk --clobber