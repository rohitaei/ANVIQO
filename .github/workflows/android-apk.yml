name: ANVIQO Android Release APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: mkdir -p www
      - run: cp anviqo_dashboard.html www/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - name: Prepare stable APK name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ANVIQO-Android.apk
      - name: Upload APK to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ANVIQO-Android.apk --clobber