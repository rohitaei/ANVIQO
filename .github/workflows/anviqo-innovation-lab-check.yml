name: ANVIQO Innovation Lab Checks

on:
  push:
    branches: [anviqo-innovation-lab-2026-11-14]

jobs:
  evidence-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile changed intelligence modules
        run: |
          python -m py_compile anviqo_api.py pci_live_simulator.py
          python -m py_compile anvi_consistency_intelligence.py anvi_decision_brief.py
      - name: Run new evidence intelligence tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_anvi_consistency_intelligence.py tests/test_anvi_decision_brief.py
