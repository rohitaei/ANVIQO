<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANVIQO — ANVI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8eefc;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{height:64px;border-bottom:1px solid #26314d;display:flex;align-items:center;padding:0 22px;justify-content:space-between;background:#10172a}
.logo{font-size:21px;font-weight:700;letter-spacing:.5px}.logo span{color:#55c7ff}
.status{font-size:12px;color:#7ee2a8}
main{flex:1;overflow:auto;padding:25px 16px 130px}
.chat{max-width:900px;margin:auto}
.welcome{text-align:center;margin:55px auto 30px}
.welcome h1{font-size:32px;margin:0 0 10px}.welcome p{color:#91a0bd}
.msg{display:flex;margin:18px 0}.user{justify-content:flex-end}
.bubble{max-width:82%;padding:14px 17px;border-radius:17px;line-height:1.55;white-space:pre-wrap}
.ai .bubble{background:#151e35;border:1px solid #263654}
.user .bubble{background:#1769a8}
.sources{font-size:11px;color:#7f91b2;margin-top:6px}
.composer{position:fixed;bottom:0;left:0;right:0;background:#0b1020;border-top:1px solid #26314d;padding:14px}
.box{max-width:900px;margin:auto;display:flex;gap:9px}
textarea{flex:1;background:#111a30;color:#fff;border:1px solid #344363;border-radius:14px;padding:14px;font-size:15px;resize:none;min-height:52px;max-height:140px}
button{border:0;border-radius:13px;padding:0 17px;background:#1677b8;color:#fff;font-weight:700}
button:hover{background:#1b8bd3}
#mic{background:#263653;font-size:18px}
.thinking{opacity:.65}
</style>
</head>
<body>
<header>
<div class="logo">ANVI<span>QO</span> <small>• ANVI</small></div>
<div class="status">● PLANT INTELLIGENCE ONLINE</div>
</header>

<main id="main">
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<h1>How can I help?</h1>
<p>Ask ANVI about your plant, PCI instruments, PLC/I/O, equipment, alarms, maintenance, events or plant intelligence.</p>
</div>
</div>
</main>

<div class="composer">
<div class="box">
<textarea id="input" placeholder="Ask ANVI anything about the plant..." rows="1"></textarea>
<button id="mic" title="Voice">🎙</button>
<button id="send">Send</button>
</div>
</div>

<script>
const input=document.getElementById("input");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const send=document.getElementById("send");

function add(role,text){
 if(welcome) welcome.remove();
 const row=document.createElement("div");
 row.className="msg "+role;
 const b=document.createElement("div");
 b.className="bubble";
 b.textContent=text;
 row.appendChild(b);chat.appendChild(row);
 window.scrollTo(0,document.body.scrollHeight);
 return b;
}

function extract(x){
 if(typeof x==="string") return x;
 if(!x) return "";
 return x.answer||x.response||x.message||x.result||x.text||
        (x.data&&(x.data.answer||x.data.response||x.data.message))||JSON.stringify(x,null,2);
}

async function ask(q){
 const b=add("ai","ANVI is thinking...");
 b.classList.add("thinking");
 try{
   let r=await fetch("/api/ask",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({question:q,query:q,message:q})
   });
   let t=await r.text();
   let x;try{x=JSON.parse(t)}catch(e){x=t}
   b.classList.remove("thinking");
   b.textContent=extract(x)||"ANVI received the request but returned no response.";
 }catch(e){
   b.classList.remove("thinking");
   b.textContent="ANVI could not reach the intelligence service. Please check the ANVIQO API.";
 }
}

send.onclick=()=>{
 const q=input.value.trim();if(!q)return;
 add("user",q);input.value="";ask(q);
};
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.click()}
});

const mic=document.getElementById("mic");
if("webkitSpeechRecognition" in window || "SpeechRecognition" in window){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const rec=new SR();rec.lang="en-IN";
 rec.onresult=e=>{input.value=e.results[0][0].transcript;send.click()};
 mic.onclick=()=>rec.start();
}else mic.style.display="none";
</script>
</body>
</html>
